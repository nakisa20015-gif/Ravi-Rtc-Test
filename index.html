<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RAVI Online Lab v3</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;padding:16px}h2{color:#d9b94e;margin:8px 0}.card{background:#111c2e;padding:12px;border-radius:14px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #3a4860}input{background:#0b1525;color:#fff;min-width:0;flex:1}button{background:#d9b94e;color:#07111f;font-weight:700}.secondary{background:#18263a;color:#fff}.danger{background:#7f1d1d;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:210px}.tile video{width:100%;height:100%;min-height:210px;object-fit:cover;display:block}.tag{position:absolute;right:8px;bottom:8px;background:#000a;padding:5px 8px;border-radius:8px;font-size:12px}#status{direction:ltr;text-align:left;white-space:pre-wrap;font-size:13px}.muted{opacity:.65}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body>
<h2>RAVI Online Lab v3</h2><div id="status" class="card">Ready</div>
<div class="card"><div class="row"><input id="name" placeholder="نام بازیکن" value="Player"><input id="room" value="ravi-test" placeholder="کد اتاق"><button id="join">ورود</button></div><div class="row" style="margin-top:8px"><button id="mic" class="secondary">🎙 میکروفون</button><button id="cam" class="secondary">📷 دوربین</button><button id="leave" class="danger" disabled>خروج</button></div></div>
<div id="grid" class="grid"><div class="tile" id="localTile"><video id="local" autoplay muted playsinline></video><span class="tag" id="localTag">من</span></div></div>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const sb=createClient("https://iqrzbbepfqiqojozodmj.supabase.co","sb_publishable_C5Oq7_yobOS02VgDzUv6nw_eZ3CYAqd",{auth:{persistSession:false}});
const $=x=>document.getElementById(x),id=crypto.randomUUID(),status=$("status"),grid=$("grid");let ch=null,stream=null,joined=false;const peers=new Map();
const ice={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
const st=x=>status.textContent=x; const myName=()=>($("name").value.trim()||"Player").slice(0,30);
async function media(){if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$("local").srcObject=stream;$("localTag").textContent=myName()+" (من)"}return stream}
function tile(pid,label){let t=$("p-"+pid);if(t)return t; t=document.createElement("div");t.className="tile";t.id="p-"+pid;t.innerHTML='<video autoplay playsinline></video><span class="tag"></span>';t.querySelector(".tag").textContent=label||"بازیکن";grid.appendChild(t);return t}
function removePeer(pid){const x=peers.get(pid);if(x){x.pc.close();peers.delete(pid)}$("p-"+pid)?.remove();render()}
function render(extra=""){st("ONLINE • "+(peers.size+1)+" نفر"+(extra?" • "+extra:""))}
function send(kind,data,to=null){if(!ch)return;return ch.send({type:"broadcast",event:"sig",payload:{from:id,to,kind,data,name:myName()}})}
async function getPeer(pid,label){if(peers.has(pid))return peers.get(pid);await media();const pc=new RTCPeerConnection(ice),obj={pc,pending:[],name:label||"بازیکن"};peers.set(pid,obj);stream.getTracks().forEach(t=>pc.addTrack(t,stream));const t=tile(pid,obj.name),v=t.querySelector("video");pc.ontrack=e=>{v.srcObject=e.streams[0];v.play().catch(()=>{});render("connected")};pc.onicecandidate=e=>e.candidate&&send("candidate",e.candidate,pid);pc.onconnectionstatechange=()=>{if(pc.connectionState==="connected")render("connected");if(["failed","closed"].includes(pc.connectionState)){if(pc.connectionState==="failed")st("اتصال یک بازیکن ناموفق شد — TURN ممکن است لازم باشد");removePeer(pid)}};return obj}
async function flush(o){while(o.pending.length&&o.pc.remoteDescription)await o.pc.addIceCandidate(o.pending.shift())}
async function offer(pid,label){const o=await getPeer(pid,label);if(o.pc.signalingState!=="stable")return;const d=await o.pc.createOffer();await o.pc.setLocalDescription(d);await send("desc",o.pc.localDescription,pid)}
async function signal(m){if(!m||m.from===id||(m.to&&m.to!==id))return;const pid=m.from;
 if(m.kind==="hello"){await send("ack",null,pid);if(id<pid)await offer(pid,m.name);return}
 if(m.kind==="ack"){if(id<pid)await offer(pid,m.name);return}
 if(m.kind==="bye"){removePeer(pid);return}
 const o=await getPeer(pid,m.name);tile(pid,m.name).querySelector(".tag").textContent=m.name||"بازیکن";
 if(m.kind==="desc"){if(m.data.type==="offer"){if(o.pc.signalingState!=="stable"){removePeer(pid);return signal(m)}await o.pc.setRemoteDescription(m.data);await flush(o);const a=await o.pc.createAnswer();await o.pc.setLocalDescription(a);await send("desc",o.pc.localDescription,pid)}else{await o.pc.setRemoteDescription(m.data);await flush(o)}}
 else if(m.kind==="candidate"){if(o.pc.remoteDescription)await o.pc.addIceCandidate(m.data);else o.pending.push(m.data)}
}
$("join").onclick=async()=>{try{if(joined)return;await media();joined=true;$("join").disabled=true;$("leave").disabled=false;$("name").disabled=true;$("room").disabled=true;ch=sb.channel("ravi-lab-"+$("room").value.trim(),{config:{broadcast:{self:false},presence:{key:id}}});ch.on("broadcast",{event:"sig"},x=>signal(x.payload).catch(e=>st("Signal: "+e.message)));ch.on("presence",{event:"leave"},x=>{for(const k of Object.keys(x.leftPresences||{}))removePeer(k)});ch.on("presence",{event:"sync"},()=>render());ch.subscribe(async x=>{if(x==="SUBSCRIBED"){await ch.track({id,name:myName(),ts:Date.now()});render("waiting");await send("hello",{ts:Date.now()})}if(x==="CHANNEL_ERROR")st("Realtime error")})}catch(e){joined=false;$("join").disabled=false;st("ERROR: "+e.message)}};
$("mic").onclick=()=>{if(!stream)return;const t=stream.getAudioTracks()[0];t.enabled=!t.enabled;$("mic").textContent=t.enabled?"🎙 میکروفون":"🔇 میکروفون خاموش"};
$("cam").onclick=()=>{if(!stream)return;const t=stream.getVideoTracks()[0];t.enabled=!t.enabled;$("cam").textContent=t.enabled?"📷 دوربین":"🚫 دوربین خاموش"};
async function leave(){if(!joined)return;try{await send("bye",null)}catch{};for(const k of [...peers.keys()])removePeer(k);if(ch){await sb.removeChannel(ch);ch=null}joined=false;$("join").disabled=false;$("leave").disabled=true;$("name").disabled=false;$("room").disabled=false;st("خارج شدی — می‌توانی دوباره وارد شوی")}
$("leave").onclick=leave;addEventListener("pagehide",()=>{try{send("bye",null)}catch{}});
</script></body></html>
