<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RAVI Online Lab v5.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;padding:14px}h2{color:#d9b94e}.card{background:#111c2e;padding:11px;border-radius:14px;margin:9px 0}.row{display:flex;gap:7px;flex-wrap:wrap}input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #3a4860}input{background:#0b1525;color:#fff;min-width:0;flex:1}button{background:#d9b94e;color:#07111f;font-weight:700}.sec{background:#18263a;color:#fff}.red{background:#7f1d1d;color:#fff}.green{background:#14532d;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:205px}.tile video{width:100%;height:100%;min-height:205px;object-fit:cover}.tag{position:absolute;right:7px;bottom:7px;background:#000b;padding:5px 7px;border-radius:8px;font-size:12px}.badges{position:absolute;left:7px;top:7px}.badge{background:#000b;padding:4px 6px;border-radius:7px;font-size:11px}.person{background:#0b1525;padding:8px;border-radius:10px;margin:6px 0}.hostctl{display:flex;gap:5px;margin-top:6px}.hostctl button{padding:6px;font-size:12px}#status{direction:ltr;text-align:left;font-size:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body>
<h2>RAVI Online Lab v5.2</h2><div id="status" class="card">Ready</div><div class="card"><div class="row"><input id="name" value="Player" placeholder="نام"><input id="room" placeholder="کد اتاق"><button id="create" class="green">ساخت اتاق (گرداننده)</button><button id="join">ورود</button></div><div class="row" style="margin-top:7px"><button id="copy" class="sec">کپی لینک</button><button id="mic" class="sec">🎙 روشن</button><button id="cam" class="sec">📷 روشن</button><button id="leave" class="red" disabled>خروج</button></div></div><div class="card"><b>افراد اتاق: <span id="count">0</span></b><div id="people"></div></div><div id="grid" class="grid"><div class="tile"><video id="local" autoplay muted playsinline></video><div class="badges"><span class="badge" id="role">من</span></div><span class="tag" id="localTag">من</span></div></div>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const sb=createClient("https://iqrzbbepfqiqojozodmj.supabase.co","sb_publishable_C5Oq7_yobOS02VgDzUv6nw_eZ3CYAqd",{auth:{persistSession:false}}),$=x=>document.getElementById(x),id=crypto.randomUUID(),peers=new Map();let ch,stream,joined=false,isHost=false,hostId=null;const ice={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]},st=x=>$("status").textContent=x,nm=()=>($("name").value.trim()||"Player").slice(0,30);$("room").value=new URLSearchParams(location.search).get("room")||"";
async function media(){if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$("local").srcObject=stream;$("localTag").textContent=nm()+" (من)"}return stream}function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function list(){const a=[];for(const ar of Object.values(ch?.presenceState?.()||{}))for(const p of ar)if(!a.some(x=>x.id===p.id))a.push(p);return a}function render(m=""){const a=list();$("count").textContent=a.length;$("people").innerHTML=a.map(p=>{const ctl=isHost&&p.id!==id?'<div class="hostctl"><button data-c="mic" data-id="'+p.id+'">🔇 میوت</button><button data-c="cam" data-id="'+p.id+'">🚫 بستن تصویر</button></div>':"";return '<div class="person">'+(p.host?"👑 ":"")+(p.name||"Player")+(p.mic===false?" 🔇":"")+(p.cam===false?" 🚫":"")+ctl+'</div>'}).join("");document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>control(b.dataset.id,b.dataset.c));st("ONLINE • "+a.length+" نفر"+(m?" • "+m:""))}
function send(kind,data,to=null){return ch?.send({type:"broadcast",event:"sig",payload:{from:id,to,kind,data,name:nm(),host:isHost}})}async function control(to,what){if(!isHost)return;await send("host-control",{what,enabled:false},to);st((what==="mic"?"Mute":"Camera off")+" command sent")}
function tile(pid,n,h){let t=$("p-"+pid);if(t)return t;t=document.createElement("div");t.className="tile";t.id="p-"+pid;t.innerHTML='<video autoplay playsinline></video><div class="badges"><span class="badge">'+(h?"👑":"")+'</span></div><span class="tag">'+(n||"Player")+'</span>';grid.appendChild(t);return t}function drop(pid){peers.get(pid)?.pc.close();peers.delete(pid);$("p-"+pid)?.remove();render()}
async function P(pid,n,h){if(peers.has(pid))return peers.get(pid);await media();const pc=new RTCPeerConnection(ice),o={pc,q:[]};peers.set(pid,o);stream.getTracks().forEach(t=>pc.addTrack(t,stream));const v=tile(pid,n,h).querySelector("video");pc.ontrack=e=>{let rs=e.streams&&e.streams[0];if(!rs){rs=v.srcObject instanceof MediaStream?v.srcObject:new MediaStream();rs.addTrack(e.track)}v.srcObject=rs;v.playsInline=true;v.autoplay=true;v.play().catch(()=>{});render("connected")};pc.onicecandidate=e=>e.candidate&&send("ice",e.candidate,pid);pc.onconnectionstatechange=()=>{if(pc.connectionState==="failed"){drop(pid);setTimeout(()=>send("hello",{}),1000)}};return o}async function flush(o){while(o.q.length&&o.pc.remoteDescription)await o.pc.addIceCandidate(o.q.shift())}async function offer(pid,n,h){const o=await P(pid,n,h);if(o.pc.signalingState!=="stable")return;await o.pc.setLocalDescription(await o.pc.createOffer());await send("desc",o.pc.localDescription,pid)}
async function sig(m){if(!m||m.from===id||(m.to&&m.to!==id))return;if(m.host===true)hostId=m.from;const pid=m.from;if(m.kind==="host-control"){if(m.host!==true||m.from!==hostId)return;const t=m.data.what==="mic"?stream?.getAudioTracks()[0]:stream?.getVideoTracks()[0];if(t){t.enabled=m.data.enabled;if(m.data.what==="mic")$("mic").textContent=t.enabled?"🎙 روشن":"🔇 خاموش توسط گرداننده";else $("cam").textContent=t.enabled?"📷 روشن":"🚫 بسته توسط گرداننده";await state();st("گرداننده "+(m.data.what==="mic"?"میکروفون":"دوربین")+" شما را خاموش کرد")}return}if(m.kind==="hello"){await send("ack",null,pid);if(id<pid)await offer(pid,m.name,m.host);return}if(m.kind==="ack"){if(id<pid)await offer(pid,m.name,m.host);return}if(m.kind==="bye"){drop(pid);return}const o=await P(pid,m.name,m.host);if(m.kind==="desc"){if(m.data.type==="offer"){if(o.pc.signalingState!=="stable"){drop(pid);return sig(m)}await o.pc.setRemoteDescription(m.data);await flush(o);await o.pc.setLocalDescription(await o.pc.createAnswer());await send("desc",o.pc.localDescription,pid)}else{await o.pc.setRemoteDescription(m.data);await flush(o)}}else if(m.kind==="ice"){if(o.pc.remoteDescription)await o.pc.addIceCandidate(m.data);else o.q.push(m.data)}}
async function enter(h){try{if(joined)return;let r=$("room").value.trim().toUpperCase();if(h&&!r){r=code();$("room").value=r}if(!r)return st("کد اتاق را وارد کن");isHost=h;if(h)hostId=id;await media();joined=true;$("join").disabled=$("create").disabled=true;$("leave").disabled=false;$("name").disabled=$("room").disabled=true;$("role").textContent=h?"👑 گرداننده":"بازیکن";history.replaceState(null,"","?room="+r);ch=sb.channel("ravi-v5-"+r,{config:{broadcast:{self:false},presence:{key:id}}});ch.on("broadcast",{event:"sig"},x=>sig(x.payload).catch(e=>st("Signal: "+e.message))).on("presence",{event:"sync"},()=>render()).subscribe(async x=>{if(x==="SUBSCRIBED"){await state();await send("hello",{});setTimeout(()=>send("hello",{}),700);render("waiting")}})}catch(e){st("ERROR: "+e.message)}}
async function state(){if(!ch)return;const mic=stream?.getAudioTracks()[0]?.enabled??false,cam=stream?.getVideoTracks()[0]?.enabled??false;await ch.track({id,name:nm(),host:isHost,mic,cam,ts:Date.now()});render()}$("create").onclick=()=>enter(true);$("join").onclick=()=>enter(false);$("copy").onclick=async()=>{const r=$("room").value.trim();if(r){await navigator.clipboard.writeText(location.origin+location.pathname+"?room="+r);st("لینک کپی شد ✓")}};$("mic").onclick=async()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$("mic").textContent=t.enabled?"🎙 روشن":"🔇 خاموش";await state()}};$("cam").onclick=async()=>{const t=stream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$("cam").textContent=t.enabled?"📷 روشن":"🚫 خاموش";await state()}};
$("leave").onclick=async()=>{await send("bye",null);for(const k of [...peers.keys()])drop(k);if(ch)await sb.removeChannel(ch);ch=null;joined=false;isHost=false;hostId=null;$("join").disabled=$("create").disabled=false;$("leave").disabled=true;$("name").disabled=$("room").disabled=false;st("خارج شدی")};addEventListener("pagehide",()=>{try{send("bye",null)}catch{}});
</script></body></html>
